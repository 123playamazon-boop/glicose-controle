   {e:"2️⃣",t:"Primeiros dias",p:"Monta o prato pela lista e começa a sentir mais leveza e energia depois das refeições."},
   {e:"3️⃣",t:"Primeiras semanas",p:"Com o planner, você acompanha de perto e cria o hábito que se mantém sozinho."}

/* ===== ENGINE ===== */
var idx=0, total=STEPS.length;
var scr=document.getElementById('screen');
var ctawrap=document.getElementById('ctawrap'), ctaBtn=document.getElementById('ctaBtn'), cnote=document.getElementById('cnote');
var pfill=document.getElementById('pfill'), pnub=document.getElementById('pnub');

function p(s){ return (s||"").split("{nome}").join(name||"amiga"); }
function progress(){ var pct=Math.max(4, Math.round((idx/(total-1))*100)); pfill.style.width=pct+"%"; pnub.style.left=pct+"%"; }
function showCTA(label,note){ ctawrap.style.display="block"; ctaBtn.textContent=label; cnote.innerHTML=note||"⏱️ Leva menos de 3 minutos"; }
function hideCTA(){ ctawrap.style.display="none"; }
function next(){ idx++; if(idx>=total) idx=total-1; render(); window.scrollTo(0,0); }

function render(){
  var s=STEPS[idx]; progress(); hideCTA(); var html="";
  document.body.classList.toggle('offer', s.k==="result");

  if(s.k==="intro"){

    return;
  }

  if(s.k==="reward"){
    if(s.head) html+='<h1 class="q">'+p(s.head)+'</h1>';
    if(s.body) html+='<p class="lede" style="font-size:15.5px">'+p(s.body)+'</p>';
    html+='<div class="reward"><span class="emo">'+s.emo+'</span><div><b>'+s.title+'</b><small>+ R$'+s.val+' em bônus desbloqueados 🎉</small></div></div>';

    html+='<h1 class="q">'+p(s.h)+'</h1><div class="opts">';

  }

  if(s.k==="loading"){
    html+='<div class="load"><div class="spin"></div><h1 class="q center">'+p(s.h)+'</h1><div class="loadbar"><i></i></div><p class="sub center" style="margin-top:14px">'+s.sub+'</p></div>';

    html+='<div class="center"><div class="eyebrow">🎉 Plano pronto</div>';

      '</div>';
    // Social proof — real WhatsApp prints (drop depo1..depo4.webp; whole block hides until then)
    html+='<div id="proofWrap" style="display:none"><div class="center" style="margin-top:22px"><div class="eyebrow">Quem já começou</div><h1 class="q" style="font-size:22px;margin-top:4px">Relatos de quem usou</h1></div>';
    html+='<div class="proof" id="proofGrid">'+
      '<figure><img loading="lazy" src="depo1.webp" alt="Relato" onload="document.getElementById(\'proofWrap\').style.display=\'block\'" onerror="this.closest(\'figure\').style.display=\'none\'"></figure>'+
      '<figure><img loading="lazy" src="depo2.webp" alt="Relato" onload="document.getElementById(\'proofWrap\').style.display=\'block\'" onerror="this.closest(\'figure\').style.display=\'none\'"></figure>'+
      '<figure><img loading="lazy" src="depo3.webp" alt="Relato" onload="document.getElementById(\'proofWrap\').style.display=\'block\'" onerror="this.closest(\'figure\').style.display=\'none\'"></figure>'+
      '<figure><img loading="lazy" src="depo4.webp" alt="Relato" onload="document.getElementById(\'proofWrap\').style.display=\'block\'" onerror="this.closest(\'figure\').style.display=\'none\'"></figure>'+
      '</div></div>';
    html+='<div class="gifts"><h3>Tudo que você recebe hoje</h3>'+
      gline("🍽️","Cardápio da Glicose no Controle","500 receitas gostosas pra café, almoço, jantar, lanches e sobremesas — pensadas pra quem convive com diabetes.","R$127")+
      gline("🥗","Lista de Alimentos Semáforo","O guia verde / amarelo / vermelho: o que comer à vontade, com moderação e o que evitar. Nunca mais fique perdida no mercado.","R$47")+
      gline("📅","Planner de Controle da Glicose","Pra registrar refeições e acompanhar sua evolução de perto, criando o hábito que se mantém sozinho.","R$47")+
      gline("⚡","Ideias de Refeição Rápida","Combinações prontas pra montar o prato em minutos nos dias corridos.","R$37")+
      gline("🎁","Pacote de Bônus","Guias extras de apoio pra facilitar ainda mais o seu dia a dia.","R$33")+
      '<div class="gline totalv"><span class="ge">🧾</span><div><b>Valor total</b><p>Tudo acima, se vendido separado</p></div><span class="gv totalp">R$291</span></div>'+
      '</div>';
    html+='<div class="pricebox"><div class="from">Valor total R$291</div><div class="now">R$'+PRICE+'</div><div class="once">Pagamento único · acesso imediato · sem mensalidade</div></div>';
    // Guarantee
    html+='<div class="guar"><div style="font-size:40px;flex:none">🛡️</div><div><b>Garantia incondicional de 7 dias</b><p>Entre, veja todo o material e comece a montar seus pratos. Se em 7 dias não for pra você, é só mandar um e-mail que devolvemos 100% do valor — e você <b>fica com os bônus</b>. O risco é todo nosso.</p></div></div>';

    html+='<div class="center" style="margin-top:22px"><div class="eyebrow">Ainda com dúvida?</div><h1 class="q" style="font-size:22px;margin-top:4px">Perguntas que todo mundo faz</h1></div>';
    html+='<div class="faq">'+
      faq("Isso substitui o meu remédio ou o médico?","Não, e nem é essa a proposta. É um material educacional de alimentação pra somar ao seu tratamento. Continue com o seu médico, seus exames e sua medicação. Nunca mude ou pare remédio por conta própria.")+
      faq("Vou ter que cortar tudo que gosto e viver de salada?","Não. A ideia é justamente o contrário: comer comida de verdade (arroz, feijão, pão, até sobremesa) do jeito certo, usando a lista semáforo. Sem passar fome.")+
      faq("Como eu recebo o material?","É 100% digital. Assim que o pagamento é aprovado, você recebe na hora, no seu WhatsApp e e-mail, o cardápio, a lista semáforo, o planner e os bônus. Nada é enviado pelo correio.")+
      faq("Serve pra pré-diabetes e pra quem já tem diabetes tipo 2?","O material foi pensado pra quem convive com glicose alta, pré-diabetes e diabetes tipo 2. Sempre adapte ao que o seu médico orienta pro seu caso.")+
      faq("As receitas são difíceis ou de ingrediente caro?","Não. São pratos do dia a dia, com ingredientes do mercado comum. A família come junto, sem precisar cozinhar duas vezes.")+
      faq("É pagamento único mesmo?","Sim. Você paga R$"+PRICE+" uma vez só e o acesso é vitalício, sem mensalidade.")+
      faq("E se eu não gostar?","Você tem 7 dias de garantia. Se não for pra você, manda um e-mail e devolvemos 100% — e ainda fica com os bônus.")+
      '</div>';

    html+='<div class="disc">Aviso importante: este é um produto educacional de alimentação e <b>não substitui acompanhamento médico, diagnóstico ou tratamento</b>. Não interrompa nem altere qualquer medicação por conta própria — fale sempre com o seu médico. Resultados variam de pessoa para pessoa e não são garantidos. Os valores mostrados são ilustrativos.</div>';
    scr.innerHTML=html;
    showCTA("Quero meu plano agora →","🔒 Checkout seguro · acesso na hora");
    cnote.innerHTML="🔒 Checkout seguro · acesso na hora";
    var u=document.createElement('div'); u.className='urg'; u.textContent='⏳ Preço de lançamento — só nesta rodada, depois volta a subir'; cnote.parentNode.insertBefore(u,cnote.nextSibling);
    ctaBtn.onclick=function(){
      try{ if(window.fbq) fbq('track','InitiateCheckout',{value:parseFloat(PRICE),currency:'BRL'}); }catch(e){}
      if(CHECKOUT_URL && CHECKOUT_URL.indexOf('http')===0){ location.href=CHECKOUT_URL+(location.search||""); }
    };
    return;
  }
}
function gline(e,t,p,v){ return '<div class="gline"><span class="ge">'+e+'</span><div><b>'+t+'</b><p>'+p+'</p></div>'+(v?'<span class="gv">'+v+'</span>':'')+'</div>'; }
function faq(q,a){ return '<details><summary>'+q+'</summary><p>'+a+'</p></details>'; }

setEarn(0); render();
</script>
